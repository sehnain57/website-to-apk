# trigger
name: Build APK
run-name: build ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id: { description: Build id, required: true }
      config:   { description: Config JSON, required: true }
      icon_b64: { description: 192px PNG base64, required: true }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Apply config and icon
        env:
          CONFIG: ${{ inputs.config }}
          ICON: ${{ inputs.icon_b64 }}
        run: |
          T=template/app/src/main
          mkdir -p $T/assets $T/res/mipmap-xxxhdpi $T/res/drawable-nodpi
          printf '%s' "$CONFIG" > $T/assets/config.json
          python3 -c "import json;json.load(open('$T/assets/config.json'))"
          printf '%s' "$ICON" | base64 -d > $T/res/mipmap-xxxhdpi/ic_launcher.png
          cp $T/res/mipmap-xxxhdpi/ic_launcher.png $T/res/drawable-nodpi/logo.png
      - name: Keystore
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/ks.jks"
          else keytool -genkeypair -keystore "$GITHUB_WORKSPACE/ks.jks" -storepass webtoapk123 -keypass webtoapk123 -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WebToAPK"; fi
      - name: Zip source code
        run: |
          cd template
          zip -qr ../source.zip . -x 'build/*' '.gradle/*' 'app/build/*'
      - name: Build
        working-directory: template
        env:
          KS_FILE: ${{ github.workspace }}/ks.jks
          KS_PASS: ${{ secrets.KS_PASS || 'webtoapk123' }}
          KS_ALIAS: ${{ secrets.KS_ALIAS || 'key' }}
        run: gradle assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BID: ${{ inputs.build_id }}
        run: |
          cp template/app/build/outputs/apk/release/app-release.apk app.apk
          gh release create "build-$BID" app.apk source.zip --title "Build $BID" --notes "Generated by WebToAPK"
